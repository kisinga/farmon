title: Water System
views:
  - title: Overview
    icon: mdi:water-pump
    cards: []
    type: sections
    subview: false
    sections:
      - type: grid
        cards:
          - type: entities
            title: System Status
            entities:
              - entity: input_select.operating_mode
                name: Season Mode
              - entity: sensor.pump_ctrl_pump_system_state
                name: Pump State
              - entity: sensor.pump_mode_display
                name: Active Operation
              - entity: sensor.pump_ctrl_pump_fault
                name: Fault
            grid_options:
              columns: full
          - type: heading
            heading: Automations
            heading_style: title
          - type: entities
            entities:
              - entity: automation.auto_refill_tank_2_4
                name: Auto refill tank2 3 times a day
              - entity: sensor.active_tank_2_refill_trigger
                name: Tank 2 refill below (active)
              - entity: sensor.active_tank_2_refill_stop
                name: Tank 2 refill stop at (active)
              - entity: sensor.active_tank_1_min_level
                name: Tank 1 conservation limit (active)
              - entity: input_boolean.auto_refill_enabled
                name: Automatic routing based on above thresholds
            show_header_toggle: false
            grid_options:
              columns: full
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: Water levels
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.combined_tank_level
          - type: entities
            entities:
              - entity: binary_sensor.water_critical
                name: Water Critical
            grid_options:
              columns: full
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.pump_ctrl_rain_tank_level
                name: Rain Tank
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 25
                  green: 50
                needle: true
              - type: gauge
                entity: sensor.pump_ctrl_storage_tank_level
                name: Storage Tank
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 25
                  green: 50
                needle: true
            grid_options:
              columns: full
              rows: auto
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: sensor
                    entity: sensor.pump_ctrl_house_1_water_flow
                    name: House 1 Flow
                    graph: line
                    hours_to_show: 6
                  - type: statistics-graph
                    entities:
                      - sensor.pump_ctrl_house_1_total_usage
                    stat_types:
                      - change
                    chart_type: bar
                    period: week
                    days_to_show: 56
                  - type: horizontal-stack
                    cards:
                      - type: statistic
                        entity: sensor.pump_ctrl_house_1_total_usage
                        stat_type: change
                        period:
                          calendar:
                            period: month
                        name: Month
                      - type: statistic
                        entity: sensor.pump_ctrl_house_1_total_usage
                        stat_type: change
                        period:
                          calendar:
                            period: year
                        name: Year
              - type: vertical-stack
                cards:
                  - type: sensor
                    entity: sensor.pump_ctrl_house_2_water_flow
                    name: House 2 Flow
                    graph: line
                    hours_to_show: 6
                  - type: statistics-graph
                    entities:
                      - sensor.pump_ctrl_house_2_total_usage
                    stat_types:
                      - change
                    chart_type: bar
                    period: week
                    days_to_show: 56
                  - type: horizontal-stack
                    cards:
                      - type: statistic
                        entity: sensor.pump_ctrl_house_2_total_usage
                        stat_type: change
                        period:
                          calendar:
                            period: month
                        name: Month
                      - type: statistic
                        entity: sensor.pump_ctrl_house_2_total_usage
                        stat_type: change
                        period:
                          calendar:
                            period: year
                        name: Year
            grid_options:
              columns: full
        column_span: 1
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                entities:
                  - entity: sensor.pump_ctrl_pump_system_state
                    name: State
                  - entity: sensor.pump_mode_display
                    name: Operation
                  - entity: sensor.pump_ctrl_pump_fault
                    name: Fault
                state_color: true
                show_header_toggle: false
              - type: entities
                entities:
                  - entity: input_select.pump_source
                    name: Source
                  - entity: input_select.pump_destination
                    name: Destination
                  - entity: sensor.preferred_house_2_source
                    name: Recommended H2 Source
                  - entity: input_number.pump_duration_minutes
                    name: Duration
                  - entity: switch.pump_ctrl_safety_override
                state_color: true
                show_header_toggle: false
              - type: horizontal-stack
                cards:
                  - show_name: true
                    show_icon: true
                    type: button
                    name: T1>T2
                    icon: mdi:water-sync
                    tap_action:
                      action: call-service
                      service: esphome.pump_ctrl_pump_start
                      data:
                        route_id: 0
                    show_state: false
                    color: purple
                  - show_name: true
                    show_icon: true
                    type: button
                    name: T1>H2
                    icon: mdi:water-sync
                    tap_action:
                      action: call-service
                      service: esphome.pump_ctrl_pump_start
                      data:
                        route_id: 1
                    show_state: false
                    color: deep-purple
                  - show_name: true
                    show_icon: true
                    type: button
                    name: T2>H2
                    icon: mdi:water-sync
                    tap_action:
                      action: call-service
                      service: esphome.pump_ctrl_pump_start
                      data:
                        route_id: 2
                    show_state: false
                    color: indigo
              - type: horizontal-stack
                cards:
                  - show_name: true
                    show_icon: true
                    type: button
                    name: Stop
                    icon: mdi:stop-circle
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      target:
                        entity_id: script.pump_stop
                    show_state: false
                    color: red
                  - show_name: true
                    show_icon: true
                    type: button
                    name: Reset Fault
                    icon: mdi:alert-circle-check
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      target:
                        entity_id: script.pump_fault_reset
                    show_state: false
                    color: accent
            title: Direct  control
            grid_options:
              columns: full
              rows: auto
          - type: glance
            title: Hardware
            show_state: true
            entities:
              - entity: cover.pump_ctrl_tank_1_outlet
                name: V1
              - entity: cover.pump_ctrl_tank_2_outlet
                name: V2
              - entity: cover.pump_ctrl_pump_to_tank_2
                name: V3
              - entity: cover.pump_ctrl_pump_to_house_2
                name: V4
            grid_options:
              columns: full
        column_span: 1
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.combined_tank_level
        name: Total water level
  - title: Settings
    path: settings
    icon: mdi:cog
    cards:
      - type: entities
        title: Rainy Season Thresholds
        entities:
          - entity: input_number.rainy_tank2_refill_trigger
            name: Tank 2 refill below
          - entity: input_number.rainy_tank2_refill_stop
            name: Tank 2 refill stop at
          - entity: input_number.rainy_tank1_min
            name: Tank 1 stop pumping at
      - type: entities
        title: Dry Season Thresholds
        entities:
          - entity: input_number.dry_tank2_refill_trigger
            name: Tank 2 refill below
          - entity: input_number.dry_tank2_refill_stop
            name: Tank 2 refill stop at
          - entity: input_number.dry_tank1_min
            name: Tank 1 stop pumping at
      - type: entities
        title: Global
        entities:
          - entity: input_number.critical_combined_level
            name: Combined low-water warning
          - entity: input_number.pump_duration_minutes
            name: Pump duration
      - type: entities
        title: Sensor Calibration (voltage)
        entities:
          - entity: number.pump_ctrl_rain_tank_cal_empty_v
            name: Rain Tank Empty
          - entity: number.pump_ctrl_rain_tank_cal_full_v
            name: Rain Tank Full
          - entity: number.pump_ctrl_storage_tank_cal_empty_v
            name: Storage Tank Empty
          - entity: number.pump_ctrl_storage_tank_cal_full_v
            name: Storage Tank Full
