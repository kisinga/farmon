# --- Script 1: Start pump with selected source/dest ---
alias: "Pump Start"
mode: single
sequence:
  - variables:
      inlet: "{% if is_state('input_select.pump_source', 'Tank 1') %}1{% else %}2{% endif %}"
      outlet: "{% if is_state('input_select.pump_destination', 'Tank 2 (Refill)') %}3{% else %}4{% endif %}"
  - condition: state
    entity_id: sensor.pump_ctrl_pump_system_state
    state: "IDLE"
  - action: esphome.pump_ctrl_pump_start
    data:
      inlet: "{{ inlet | int }}"
      outlet: "{{ outlet | int }}"

# --- Script 2: Stop pump ---
alias: "Pump Stop"
mode: single
sequence:
  - action: esphome.pump_ctrl_pump_stop

# --- Script 3: Reset fault ---
alias: "Pump Fault Reset"
mode: single
sequence:
  - action: esphome.pump_ctrl_fault_reset

# --- Script 4: Quick action — Tank 1 → Tank 2 ---
alias: "Pump Tank1 to Tank2"
mode: single
sequence:
  - action: input_select.select_option
    target: {entity_id: input_select.pump_source}
    data: {option: "Tank 1"}
  - action: input_select.select_option
    target: {entity_id: input_select.pump_destination}
    data: {option: "Tank 2 (Refill)"}
  - action: script.turn_on
    target: {entity_id: script.pump_start}

# --- Script 5: Quick action — House 2 from preferred source ---
alias: "Pump House2 Preferred"
mode: single
sequence:
  - action: input_select.select_option
    target: {entity_id: input_select.pump_source}
    data:
      option: "{{ states('sensor.preferred_house_2_source') }}"
  - action: input_select.select_option
    target: {entity_id: input_select.pump_destination}
    data: {option: "House 2"}
  - action: script.turn_on
    target: {entity_id: script.pump_start}

# --- Script 6: Start with currently selected source/dest (same as Script 1) ---
# The "Start Selected" button just calls script.pump_start directly.
# No separate script needed — the dashboard button points to script.pump_start.

# =============================================================================
# STEP 4: AUTOMATIONS (Settings → Automations → Add → ⋮ → Edit in YAML)
# Paste one at a time.
# =============================================================================

# --- Automation 1: Auto-refill Tank 2 (mode-aware, uses configurable thresholds) ---
alias: "Auto-Refill Tank 2"
mode: single
trigger:
  - platform: state
    entity_id: sensor.pump_ctrl_tank_2_level
    for: "00:01:00"
condition:
  - condition: state
    entity_id: input_boolean.auto_refill_enabled
    state: "on"
  - condition: state
    entity_id: sensor.pump_ctrl_pump_system_state
    state: "IDLE"
  - condition: template
    value_template: >
      {% set t2 = states('sensor.pump_ctrl_tank_2_level') | float(100) %}
      {% set t1 = states('sensor.pump_ctrl_tank_1_level') | float(0) %}
      {% set trigger_pct = states('sensor.active_tank_2_refill_trigger') | float(80) %}
      {% set min_t1 = states('sensor.active_tank_1_min_level') | float(20) %}
      {{ t2 < trigger_pct and t1 > min_t1 }}
action:
  - action: input_select.select_option
    target: {entity_id: input_select.pump_source}
    data: {option: "Tank 1"}
  - action: input_select.select_option
    target: {entity_id: input_select.pump_destination}
    data: {option: "Tank 2 (Refill)"}
  - action: script.turn_on
    target: {entity_id: script.pump_start}

# --- Automation 2: Stop refill when Tank 2 full or Tank 1 low ---
alias: "Stop Refill"
trigger:
  - platform: state
    entity_id:
      - sensor.pump_ctrl_tank_2_level
      - sensor.pump_ctrl_tank_1_level
condition:
  - condition: state
    entity_id: sensor.pump_ctrl_pump_system_state
    state: "RUNNING"
  - condition: state
    entity_id: input_select.pump_destination
    state: "Tank 2 (Refill)"
  - condition: template
    value_template: >
      {% set t2 = states('sensor.pump_ctrl_tank_2_level') | float(0) %}
      {% set t1 = states('sensor.pump_ctrl_tank_1_level') | float(100) %}
      {% set stop_pct = states('sensor.active_tank_2_refill_stop') | float(90) %}
      {% set min_t1 = states('sensor.active_tank_1_min_level') | float(20) %}
      {{ t2 >= stop_pct or t1 <= min_t1 }}
action:
  - action: script.turn_on
    target: {entity_id: script.pump_stop}

# --- Automation 3: Fault notification ---
alias: "Pump Fault Alert"
trigger:
  - platform: state
    entity_id: sensor.pump_ctrl_pump_system_state
    to: "FAULT"
action:
  - action: persistent_notification.create
    data:
      title: "PUMP FAULT"
      message: "{{ states('sensor.pump_ctrl_pump_fault') }}. Reset from dashboard."

# --- Automation 4: Scheduled House 2 top-up (3x daily) ---
# Runs at 06:00, 12:00, and 18:00. Uses preferred source tank.
# The ESP's tank-full detection handles stopping automatically —
# if the tank is already full, flow stops within seconds and the
# pump does a clean shutdown (minimal wear).
alias: "House 2 Scheduled Top-Up"
mode: single
trigger:
  - platform: time
    at:
      - "06:00:00"
      - "12:00:00"
      - "18:00:00"
condition:
  - condition: state
    entity_id: sensor.pump_ctrl_pump_system_state
    state: "IDLE"
  - condition: template
    value_template: >
      {% set src = states('sensor.preferred_house_2_source') %}
      {% if src == 'Tank 1' %}
        {{ states('sensor.pump_ctrl_tank_1_level') | float(0) > 5 }}
      {% else %}
        {{ states('sensor.pump_ctrl_tank_2_level') | float(0) > 5 }}
      {% endif %}
action:
  - action: script.turn_on
    target: {entity_id: script.pump_house2_preferred}

# --- Automation 5: Low water warning ---
alias: "Water Critical"
trigger:
  - platform: state
    entity_id: binary_sensor.water_critical
    to: "on"
    for: "00:05:00"
action:
  - action: persistent_notification.create
    data:
      title: "WATER LOW"
      message: >
        Tank 1: {{ states('sensor.pump_ctrl_tank_1_level') }}%,
        Tank 2: {{ states('sensor.pump_ctrl_tank_2_level') }}%.
