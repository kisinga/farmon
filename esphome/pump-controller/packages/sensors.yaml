# =============================================================================
# Pump Controller — Sensor & Measurement Layer
# =============================================================================
# AUTO-GENERATED from system manifest. Do not edit by hand.
# Regenerate: npx tsx tools/codegen/src/main.ts generate system.yaml
#
# Components:
#   - 2x flow sensors (pulse counter -> L/min + totalization)
#   - 2x tank level sensors (ADC -> 0-100%)
#   - State exposure (system_state_text, fault_text for HA)
# =============================================================================

sensor:
  # --- Flow sensors ----------------------------------------------------------
  - platform: pulse_counter
    pin:
      number: ${pin_flow1}
      mode: INPUT_PULLUP
    id: flow1
    name: "House 1 Water Flow"
    unit_of_measurement: "L/min"
    icon: "mdi:water"
    update_interval: ${update_interval}
    filters:
      - lambda: return x / ${flow_cal};
    on_value:
      - lambda: |-
          const int SENSOR_IDX = 0;
          if (id(system_state) == 2 && id(active_route) >= 0 && id(active_route) < NUM_ROUTES) {
            const Route& r = ROUTES[id(active_route)];
            if (r.flow_sensor == SENSOR_IDX && x > 0.5f) {
              id(last_flow_time) = millis();
              if (!id(flow_confirmed)) {
                uint32_t elapsed = millis() - id(pump_start_time);
                if (elapsed > (${flow_confirm_seconds} * 1000U)) {
                  id(flow_confirmed) = true;
                  ESP_LOGI("safety", "Flow confirmed on sensor %d after %us", SENSOR_IDX, elapsed / 1000);
                }
              }
            }
          }

  - platform: pulse_counter
    pin:
      number: ${pin_flow2}
      mode: INPUT_PULLUP
    id: flow2
    name: "House 2 Water Flow"
    unit_of_measurement: "L/min"
    icon: "mdi:water"
    update_interval: ${update_interval}
    filters:
      - lambda: return x / ${flow_cal};
    on_value:
      - lambda: |-
          const int SENSOR_IDX = 1;
          if (id(system_state) == 2 && id(active_route) >= 0 && id(active_route) < NUM_ROUTES) {
            const Route& r = ROUTES[id(active_route)];
            if (r.flow_sensor == SENSOR_IDX && x > 0.5f) {
              id(last_flow_time) = millis();
              if (!id(flow_confirmed)) {
                uint32_t elapsed = millis() - id(pump_start_time);
                if (elapsed > (${flow_confirm_seconds} * 1000U)) {
                  id(flow_confirmed) = true;
                  ESP_LOGI("safety", "Flow confirmed on sensor %d after %us", SENSOR_IDX, elapsed / 1000);
                }
              }
            }
          }

  # --- Flow totalization -----------------------------------------------------
  - platform: integration
    sensor: flow1
    name: "House 1 Total Usage"
    id: flow1_total
    unit_of_measurement: "L"
    time_unit: min
    icon: "mdi:counter"
    state_class: total_increasing

  - platform: integration
    sensor: flow2
    name: "House 2 Total Usage"
    id: flow2_total
    unit_of_measurement: "L"
    time_unit: min
    icon: "mdi:counter"
    state_class: total_increasing

  # --- Tank levels -----------------------------------------------------------
  - platform: adc
    pin: ${pin_tank1_level}
    id: tank1_level
    name: "Rain Tank Level"
    unit_of_measurement: "%"
    icon: "mdi:storage-tank"
    update_interval: ${update_interval}
    attenuation: 12db
    filters:
      - lambda: |-
          id(tank1_raw_voltage).publish_state(x);
          float v_empty = id(tank1_cal_empty).state;
          float v_full  = id(tank1_cal_full).state;
          if (v_full <= v_empty) return 0.0f;
          float pct = (x - v_empty) / (v_full - v_empty) * 100.0f;
          return clamp(pct, 0.0f, 100.0f);
      - lambda: |-
          const int TANK_IDX = 0;
          if (id(system_state) == 2 && id(active_route) >= 0 && id(active_route) < NUM_ROUTES) {
            if (ROUTES[id(active_route)].source_tank == TANK_IDX) return {};
          }
          return x;

  - platform: template
    id: tank1_raw_voltage
    name: "Rain Tank Raw Voltage"
    unit_of_measurement: "V"
    icon: "mdi:flash-triangle"
    accuracy_decimals: 3
    entity_category: diagnostic

  - platform: adc
    pin: ${pin_tank2_level}
    id: tank2_level
    name: "Storage Tank Level"
    unit_of_measurement: "%"
    icon: "mdi:storage-tank"
    update_interval: ${update_interval}
    attenuation: 12db
    filters:
      - lambda: |-
          id(tank2_raw_voltage).publish_state(x);
          float v_empty = id(tank2_cal_empty).state;
          float v_full  = id(tank2_cal_full).state;
          if (v_full <= v_empty) return 0.0f;
          float pct = (x - v_empty) / (v_full - v_empty) * 100.0f;
          return clamp(pct, 0.0f, 100.0f);
      - lambda: |-
          const int TANK_IDX = 1;
          if (id(system_state) == 2 && id(active_route) >= 0 && id(active_route) < NUM_ROUTES) {
            if (ROUTES[id(active_route)].source_tank == TANK_IDX) return {};
          }
          return x;

  - platform: template
    id: tank2_raw_voltage
    name: "Storage Tank Raw Voltage"
    unit_of_measurement: "V"
    icon: "mdi:flash-triangle"
    accuracy_decimals: 3
    entity_category: diagnostic

# --- Calibration numbers (adjustable from HA) --------------------------------

number:
  - platform: template
    name: "Rain Tank Cal Empty (V)"
    id: tank1_cal_empty
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 0.0
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Rain Tank Cal Full (V)"
    id: tank1_cal_full
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 3.3
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Storage Tank Cal Empty (V)"
    id: tank2_cal_empty
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 0.0
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Storage Tank Cal Full (V)"
    id: tank2_cal_full
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 3.3
    optimistic: true
    restore_value: true
    entity_category: config

# --- State exposure to HA ----------------------------------------------------

text_sensor:
  - platform: template
    id: system_state_text
    name: "Pump System State"
    icon: "mdi:state-machine"
    update_interval: 2s
    lambda: |-
      const char* states[] = {"IDLE", "PREPARING", "RUNNING", "STOPPING", "FAULT"};
      int s = id(system_state);
      return std::string((s >= 0 && s <= 4) ? states[s] : "UNKNOWN");

  - platform: template
    id: fault_text
    name: "Pump Fault"
    icon: "mdi:alert-circle"
    update_interval: 2s
    lambda: |-
      int f = id(fault_code);
      if (f == 0) return std::string("None");
      const char* faults[] = {
        "None",
        "No flow detected",
        "No level rise detected",
        "Max runtime exceeded",
        "HA connection lost",
        "Source tank empty"
      };
      std::string msg = (f >= 0 && f <= 5) ? faults[f] : "Unknown";
      if (id(active_route) >= 0 && id(active_route) < NUM_ROUTES) {
        msg += " (";
        msg += ROUTES[id(active_route)].name;
        msg += ")";
      }
      return msg;

  - platform: template
    id: last_stop_reason_text
    name: "Pump Last Stop Reason"
    icon: "mdi:alert-octagon-outline"
    update_interval: 2s
    lambda: |-
      const char* reasons[] = {
        "None",
        "Manual stop",
        "Tank full",
        "No flow detected",
        "No level rise detected",
        "Max runtime exceeded",
        "HA connection lost",
        "Source tank empty"
      };
      int r = id(stop_reason);
      return std::string((r >= 0 && r <= 7) ? reasons[r] : "Unknown");
