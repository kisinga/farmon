# =============================================================================
# Pump Controller — Sensor & Measurement Layer
# =============================================================================
# Everything we read. No actuation, no orchestration.
#
# Components:
#   - 2x flow sensors (pulse counter → L/min + totalization)
#   - 2x tank level sensors (ADC → 0–100%)
#   - Diagnostics (WiFi signal, uptime)
#   - State exposure (system_state_text, fault_text for HA)
# =============================================================================

sensor:
  # --- Flow sensors ----------------------------------------------------------
  - platform: pulse_counter
    pin:
      number: ${pin_flow_house1}
      mode: INPUT_PULLUP
    id: flow_house1
    name: "House 1 Water Flow"
    unit_of_measurement: "L/min"
    icon: "mdi:water"
    update_interval: ${update_interval}
    filters:
      - lambda: return x / ${flow_cal};

  - platform: pulse_counter
    pin:
      number: ${pin_flow_house2}
      mode: INPUT_PULLUP
    id: flow_house2
    name: "House 2 Water Flow"
    unit_of_measurement: "L/min"
    icon: "mdi:water"
    update_interval: ${update_interval}
    filters:
      - lambda: return x / ${flow_cal};
    on_value:
      # Feeds the flow watchdog: any flow > 0.5 L/min resets the timer.
      # Only flow_house2 matters — it's the only sensor on a pump path (valve4).
      - lambda: |-
          if (x > 0.5f) {
            id(last_flow_time) = millis();
            // After sustained flow for flow_confirm_seconds, mark flow as confirmed.
            // This distinguishes "tank full" (flow established then stopped) from
            // "pump failure" (flow never established) in the safety watchdog.
            if (!id(flow_confirmed) && id(system_state) == 2) {
              uint32_t elapsed = millis() - id(pump_start_time);
              if (elapsed > (${flow_confirm_seconds} * 1000U)) {
                id(flow_confirmed) = true;
                ESP_LOGI("safety", "Flow confirmed after %us", elapsed / 1000);
              }
            }
          }

  # --- Flow totalization -----------------------------------------------------
  - platform: integration
    sensor: flow_house1
    name: "House 1 Total Usage"
    id: house1_total
    unit_of_measurement: "L"
    time_unit: min
    icon: "mdi:counter"
    state_class: total_increasing

  - platform: integration
    sensor: flow_house2
    name: "House 2 Total Usage"
    id: house2_total
    unit_of_measurement: "L"
    time_unit: min
    icon: "mdi:counter"
    state_class: total_increasing

  # --- Tank levels -----------------------------------------------------------
  # 4-20mA pressure sensors with shunt resistors on ADC inputs.
  # Calibration voltages are exposed as HA-adjustable numbers — no reflash needed.
  - platform: adc
    pin: ${pin_tank1_level}
    id: tank1_level
    name: "Tank 1 Level"
    unit_of_measurement: "%"
    icon: "mdi:storage-tank"
    update_interval: ${update_interval}
    attenuation: 12db
    filters:
      - lambda: |-
          id(tank1_raw_voltage).publish_state(x);
          float v_empty = id(tank1_cal_empty).state;
          float v_full  = id(tank1_cal_full).state;
          if (v_full <= v_empty) return 0.0f;
          float pct = (x - v_empty) / (v_full - v_empty) * 100.0f;
          return clamp(pct, 0.0f, 100.0f);
      # Hold last-known-good value when this tank is the active pump source —
      # pump operation disturbs the pressure reading on the inlet line.
      - lambda: |-
          if (id(system_state) == 2 && id(target_inlet) == 1) return {};
          return x;

  - platform: template
    id: tank1_raw_voltage
    name: "Tank 1 Raw Voltage"
    unit_of_measurement: "V"
    icon: "mdi:flash-triangle"
    accuracy_decimals: 3
    entity_category: diagnostic

  - platform: adc
    pin: ${pin_tank2_level}
    id: tank2_level
    name: "Tank 2 Level"
    unit_of_measurement: "%"
    icon: "mdi:storage-tank"
    update_interval: ${update_interval}
    attenuation: 12db
    filters:
      - lambda: |-
          id(tank2_raw_voltage).publish_state(x);
          float v_empty = id(tank2_cal_empty).state;
          float v_full  = id(tank2_cal_full).state;
          if (v_full <= v_empty) return 0.0f;
          float pct = (x - v_empty) / (v_full - v_empty) * 100.0f;
          return clamp(pct, 0.0f, 100.0f);
      - lambda: |-
          if (id(system_state) == 2 && id(target_inlet) == 2) return {};
          return x;

  - platform: template
    id: tank2_raw_voltage
    name: "Tank 2 Raw Voltage"
    unit_of_measurement: "V"
    icon: "mdi:flash-triangle"
    accuracy_decimals: 3
    entity_category: diagnostic

# --- Calibration numbers (adjustable from HA) --------------------------------
# Voltage at empty (0%) and full (100%) for each tank's pressure sensor.
# Use raw voltage diagnostic sensors to read actual values, then set these.
# Defaults span full ADC range until calibrated.

number:
  - platform: template
    name: "Tank 1 Cal Empty (V)"
    id: tank1_cal_empty
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 0.0
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Tank 1 Cal Full (V)"
    id: tank1_cal_full
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 3.3
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Tank 2 Cal Empty (V)"
    id: tank2_cal_empty
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 0.0
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Tank 2 Cal Full (V)"
    id: tank2_cal_full
    icon: "mdi:tune-vertical"
    min_value: 0.0
    max_value: 3.3
    step: 0.001
    initial_value: 3.3
    optimistic: true
    restore_value: true
    entity_category: config

# --- State exposure to HA ----------------------------------------------------
# Template text sensors that translate numeric state/fault into human-readable
# strings for dashboards and automations.

text_sensor:
  - platform: template
    id: system_state_text
    name: "Pump System State"
    icon: "mdi:state-machine"
    update_interval: 2s
    lambda: |-
      const char* states[] = {"IDLE", "PREPARING", "RUNNING", "STOPPING", "FAULT"};
      int s = id(system_state);
      return std::string((s >= 0 && s <= 4) ? states[s] : "UNKNOWN");

  - platform: template
    id: fault_text
    name: "Pump Fault"
    icon: "mdi:alert-circle"
    update_interval: 2s
    lambda: |-
      const char* faults[] = {
        "None",
        "No flow detected (House 2 path)",
        "No level rise detected (refill path)",
        "Max runtime exceeded",
        "HA connection lost",
        "Source tank empty"
      };
      int f = id(fault_code);
      return std::string((f >= 0 && f <= 5) ? faults[f] : "Unknown");
