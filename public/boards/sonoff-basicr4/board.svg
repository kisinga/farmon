<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <desc>SONOFF BASICR4 breadboard view</desc>

  <!-- Board body -->
  <rect x="10" y="10" width="220" height="100" rx="6" ry="6"
        fill="#f5f5f5" stroke="#cccccc" stroke-width="2"/>

  <!-- Label -->
  <text x="120" y="38" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="14" font-weight="bold" fill="#333333">SONOFF BASICR4</text>
  <text x="120" y="56" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="10" fill="#666666">ESP32-C3 · 10A Relay</text>

  <!-- Relay output connector (right edge) -->
  <g id="relay_out">
    <circle cx="224" cy="72" r="8" fill="#4a90d9" stroke="#2c5aa0" stroke-width="1.5"/>
    <text x="224" y="76" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="8" fill="#ffffff" font-weight="bold">R</text>
    <text x="210" y="76" text-anchor="end" font-family="Arial, sans-serif"
          font-size="9" fill="#333333">GPIO4</text>
  </g>

  <!-- Switch input connector (left edge) -->
  <g id="switch_in">
    <circle cx="16" cy="72" r="8" fill="#5cb85c" stroke="#4cae4c" stroke-width="1.5"/>
    <text x="16" y="76" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="8" fill="#ffffff" font-weight="bold">S</text>
    <text x="30" y="76" text-anchor="start" font-family="Arial, sans-serif"
          font-size="9" fill="#333333">GPIO5</text>
  </g>

  <!-- LED indicator -->
  <circle cx="120" cy="88" r="4" fill="#2196f3" stroke="#1976d2" stroke-width="1"/>
  <text x="120" y="102" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="8" fill="#666666">LED</text>
</svg>
