<div class="h-screen bg-base-200 text-base-content flex flex-col overflow-hidden">
  <!-- Global top bar (hidden on the public landing/login, which carry their own) -->
  @if (!isPublic()) {
  <header class="navbar bg-base-100 border-b border-base-300/40 px-4 min-h-[var(--header-h)] h-[var(--header-h)]">
    <div class="navbar-start gap-3">
      <a routerLink="/home" class="flex items-center gap-2.5 shrink-0 hover:opacity-80 transition-opacity">
        <span class="w-7 h-7 block" [innerHTML]="logoSvg"></span>
        <span class="font-bold text-base tracking-tight">MajiFlow</span>
      </a>
    </div>

    <div class="navbar-center hidden md:flex gap-1">
      @if (auth.isAdmin()) {
        <a routerLink="/overview" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Sites</a>
        <a routerLink="/devices" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Devices</a>
        <a routerLink="/boards" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Boards</a>
        <a routerLink="/leads" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Leads</a>
      } @else if (auth.isAuthenticated()) {
        <a routerLink="/home" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">My Sites</a>
      }
    </div>

    <div class="navbar-end gap-1">
      @if (auth.isAdmin()) {
        <a routerLink="/settings" routerLinkActive="btn-active" class="btn btn-ghost btn-sm btn-square" title="Settings" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </a>
      }
      @if (auth.user(); as u) {
        <div class="dropdown dropdown-end">
          <button tabindex="0" class="btn btn-ghost btn-sm gap-1.5">
            <span class="text-xs text-base-content/70 max-w-[160px] truncate">{{ u.email }}</span>
            <span class="badge badge-xs badge-ghost uppercase">{{ u.role }}</span>
          </button>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow-lg border border-base-300/40 z-50 w-44 mt-2 p-1.5">
            <li><button (click)="logout()">Sign out</button></li>
          </ul>
        </div>
      }
    </div>
  </header>
  }

  <!-- Main content -->
  <main class="flex-1 flex overflow-hidden min-w-0">
    <router-outlet />
  </main>

  <!-- Confirm dialog (global) -->
  <app-confirm-dialog />
</div>
