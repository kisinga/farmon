<div class="h-screen bg-base-200 flex flex-col overflow-hidden">
  <!-- Navbar (hidden on the public landing, which carries its own) -->
  @if (!isPublic()) {
  <header class="navbar bg-base-100 shadow-sm border-b border-base-300/30 px-4 min-h-[var(--header-h)] h-[var(--header-h)]">
    <div class="navbar-start gap-3">
      <a routerLink="/home" class="flex items-center gap-2.5 shrink-0 hover:opacity-80 transition-opacity">
        <div class="w-7 h-7" [innerHTML]="logoSvg"></div>
        <span class="font-bold text-base tracking-tight text-base-content">MajiFlow</span>
      </a>
      <!-- Back link -->
      @if (backLink(); as bl) {
        <a [routerLink]="bl.link" class="flex items-center gap-1.5 text-sm font-medium hover:opacity-80 transition-opacity" [class]="bl.colorClass">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          {{ bl.label }}
        </a>
      }
    </div>
    <div class="navbar-center hidden md:flex gap-1">
      @if (auth.isAdmin()) {
        <a routerLink="/overview" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Sites</a>
        <a routerLink="/boards" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Boards</a>
      } @else if (auth.isAuthenticated()) {
        <a routerLink="/home" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">My Sites</a>
      }
    </div>
    <div class="navbar-end gap-2">
      @if (navLevel() === 'editor') {
        <app-context-strip />
      }
      @if (auth.user(); as u) {
        <div class="dropdown dropdown-end">
          <button tabindex="0" class="btn btn-ghost btn-sm gap-1.5">
            <span class="text-xs text-base-content/70 max-w-[160px] truncate">{{ u.email }}</span>
            <span class="badge badge-xs badge-ghost uppercase">{{ u.role }}</span>
          </button>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow-lg border border-base-300/40 z-50 w-44 mt-2 p-1.5">
            <li><button (click)="logout()">Sign out</button></li>
          </ul>
        </div>
      }
    </div>
  </header>
  }

  <!-- Workspace rail (below navbar, above content) -->
  @if (navLevel() === 'editor') {
    <app-pipeline-rail />
  }

  <!-- Main content -->
  <main class="flex-1 flex overflow-hidden min-w-0">
    <router-outlet />
  </main>

  <!-- Save cue toast -->
  @if (saveToastVisible()) {
    <div class="toast toast-start toast-bottom z-50 transition-opacity duration-500">
      <div class="alert alert-success py-2 px-3 text-xs shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>Saved</span>
      </div>
    </div>
  }

  <!-- Confirm dialog (global) -->
  <app-confirm-dialog />
</div>
