schema: 18
controllers:
  - id: vfd-ctrl
    directory: vfd-pump-controller
    board: heltec-v3
    friendlyName: VFD Controller
    uart_buses:
      - id: uart_modbus
        tx_pin: GPIO17
        rx_pin: GPIO18
        de_pin: GPIO19
        baud_rate: 9600
    io_providers:
      - id: vfd1_ctrl
        type: modbus_controller
        config:
          bus: uart_modbus
          address: 1
nodes:
  - kind: tank
    id: tank1
    name: Rain Tank
    level_monitored: true
    pressure_pin: GPIO20
    pressure_sensor_max_psi: 15
    anchorId: vfd-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 100, y: 250 }
  - kind: tank
    id: tank2
    name: Storage Tank
    level_monitored: true
    pressure_pin: GPIO21
    pressure_sensor_max_psi: 15
    anchorId: vfd-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 800, y: 150 }
  - kind: vfd
    id: vfd1
    name: Main VFD
    controller: vfd1_ctrl
    start_register: 1
    speed_register: 2
    max_frequency: 50
    power_register: 8
    frequency_register: 9
    fault_reset_register: 10
    anchorId: vfd-ctrl
    ports:
      - { id: in, label: Inlet, direction: inlet }
      - { id: out, label: Outlet, direction: outlet }
    position: { x: 400, y: 300 }
  - kind: valve
    id: valve1
    name: Tank 1 Outlet
    open_pin: GPIO4
    close_pin: GPIO5
    anchorId: vfd-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 250, y: 280 }
  - kind: valve
    id: valve2
    name: Tank 2 Inlet
    open_pin: GPIO6
    close_pin: GPIO7
    anchorId: vfd-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 600, y: 200 }
  - kind: flow_sensor
    id: flow1
    name: Refill Flow
    pin: GPIO47
    flow_cal: 450
    anchorId: vfd-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 700, y: 200 }
pipes:
  - { id: p1, from: "tank1:outlet", to: "valve1:inlet" }
  - { id: p2, from: "valve1:outlet", to: "vfd1:in" }
  - { id: p3, from: "vfd1:out", to: "valve2:inlet" }
  - { id: p4, from: "valve2:outlet", to: "flow1:inlet" }
  - { id: p5, from: "flow1:outlet", to: "tank2:inlet" }
route_overrides:
  tank1>tank2#valve1+valve2:
    max_runtime_seconds: 600
timing:
  valve_travel_time: 15
  flow_watchdog: 30
  flow_confirm: 15
  flow_threshold: 0.5
  api_watchdog: 300
  update_interval: 5
automations: []
