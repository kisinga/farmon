schema: 18
controllers:
  - id: kc868-ctrl
    directory: kc868-controller
    board: kc868-a16
    friendlyName: KC868 Controller
    local:
      ui: true
nodes:
  - kind: tank
    id: tank1
    name: Rain Tank
    level_monitored: true
    pressure_pin: GPIO36
    pressure_sensor_max_psi: 15
    anchorId: kc868-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 100, y: 200 }

  - kind: valve
    id: valve1
    name: Tank 1 Outlet
    open_pin: OUT1
    close_pin: OUT2
    anchorId: kc868-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 250, y: 200 }

  - kind: pump
    id: pump
    name: Main Pump
    pin: OUT3
    anchorId: kc868-ctrl
    ports:
      - { id: in, label: Inlet, direction: inlet }
      - { id: out, label: Outlet, direction: outlet }
    position: { x: 400, y: 200 }

  - kind: flow_sensor
    id: flow1
    name: Main Flow
    pin: GPIO32
    flow_cal: 450
    anchorId: kc868-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
      - { id: outlet, label: Outlet, direction: outlet }
    position: { x: 550, y: 200 }

  - kind: endpoint
    id: house1
    name: House 1
    anchorId: kc868-ctrl
    ports:
      - { id: inlet, label: Inlet, direction: inlet }
    position: { x: 700, y: 200 }

pipes:
  - { id: p1, from: "tank1:outlet", to: "valve1:inlet" }
  - { id: p2, from: "valve1:outlet", to: "pump:in" }
  - { id: p3, from: "pump:out", to: "flow1:inlet" }
  - { id: p4, from: "flow1:outlet", to: "house1:inlet" }

timing:
  valve_travel_time: 15
  flow_watchdog: 30
  flow_confirm: 15
  flow_threshold: 0.5
  update_interval: 5
