schema: 6
device:
  name: pump-ctrl
  friendly_name: Pump-ctrl
  board: heltec-v3
  directory: pump-controller
nodes:
  - kind: tank
    id: tank1
    name: Rain Tank
    level_pin: GPIO19
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 100
      y: 250
  - kind: tank
    id: tank2
    name: Storage Tank
    level_pin: GPIO20
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 800
      y: 150
  - kind: pump
    id: pump
    pin: GPIO42
    ports:
      - id: in
        label: Inlet
        direction: inlet
      - id: out
        label: Outlet
        direction: outlet
    position:
      x: 400
      y: 300
  - kind: endpoint
    id: h2
    name: House 2
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
    position:
      x: 800
      y: 500
  - kind: valve
    id: valve1
    name: Tank 1 Outlet
    open_pin: GPIO4
    close_pin: GPIO5
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 250
      y: 280
  - kind: valve
    id: valve2
    name: Tank 2 Outlet
    open_pin: GPIO6
    close_pin: GPIO7
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 250
      y: 370
  - kind: valve
    id: valve3
    name: Pump to Tank 2
    open_pin: GPIO2
    close_pin: GPIO3
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 550
      y: 200
  - kind: valve
    id: valve4
    name: Pump to House 2
    open_pin: GPIO39
    close_pin: GPIO40
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 550
      y: 400
  - kind: flow_sensor
    id: flow3
    name: Refill Line Flow
    pin: GPIO47
    flow_cal: 450
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 680
      y: 200
  - kind: flow_sensor
    id: flow2
    name: House 2 Water Flow
    pin: GPIO46
    flow_cal: 450
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 680
      y: 450
pipes:
  - id: pipe1
    from: tank1:outlet
    to: valve1:inlet
  - id: pipe2
    from: valve1:outlet
    to: pump:in
  - id: pipe3
    from: tank2:outlet
    to: valve2:inlet
  - id: pipe4
    from: valve2:outlet
    to: pump:in
  - id: pipe5
    from: pump:out
    to: valve3:inlet
  - id: pipe6
    from: valve3:outlet
    to: flow3:inlet
  - id: pipe7
    from: flow3:outlet
    to: tank2:inlet
  - id: pipe8
    from: pump:out
    to: valve4:inlet
  - id: pipe9
    from: valve4:outlet
    to: flow2:inlet
  - id: pipe10
    from: flow2:outlet
    to: h2:inlet
route_overrides:
  tank1>tank2:
    max_runtime_seconds: 600
  tank1>h2:
    max_runtime_seconds: 1800
  tank2>h2:
    max_runtime_seconds: 1800
timing:
  valve_travel_time: 15s
  flow_watchdog_seconds: 30
  flow_confirm_seconds: 15
  api_watchdog_seconds: 300
  update_interval: 5s
automations:
  - id: daily_refill
    name: Daily Refill
    route: tank1>tank2
    trigger:
      type: time
      at: "06:00"
    days_of_week: [MON, TUE, WED, THU, FRI, SAT, SUN]
    conditions:
      source_min_level: 20
      dest_max_level: 90
    enabled: true
