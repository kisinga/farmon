schema: 3
device:
  name: pump-ctrl
  friendly_name: Pump-ctrl
  board: heltec-v3
  directory: pump-controller
nodes:
  - kind: tank
    id: tank1
    name: Rain Tank
    level_pin: GPIO19
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 100
      y: 100
  - kind: tank
    id: tank2
    name: Storage Tank
    level_pin: GPIO20
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
      - id: outlet
        label: Outlet
        direction: outlet
    position:
      x: 700
      y: 250
  - kind: pump
    id: pump
    pin: GPIO42
    ports:
      - id: in
        label: Inlet
        direction: inlet
      - id: out
        label: Outlet
        direction: outlet
    position:
      x: 400
      y: 175
  - kind: endpoint
    id: h2
    name: House 2
    ports:
      - id: inlet
        label: Inlet
        direction: inlet
    position:
      x: 700
      y: 400
pipes:
  - id: pipe1
    from: tank1:outlet
    to: pump:in
    components:
      - kind: valve
        id: valve1
        name: Tank 1 Outlet
        open_pin: GPIO4
        close_pin: GPIO5
  - id: pipe2
    from: tank2:outlet
    to: pump:in
    components:
      - kind: valve
        id: valve2
        name: Tank 2 Outlet
        open_pin: GPIO6
        close_pin: GPIO7
  - id: pipe3
    from: pump:out
    to: tank2:inlet
    components:
      - kind: valve
        id: valve3
        name: Pump to Tank 2
        open_pin: GPIO2
        close_pin: GPIO3
      - kind: flow_sensor
        id: flow3
        name: Refill Line Flow
        pin: GPIO47
        flow_cal: 450
  - id: pipe4
    from: pump:out
    to: h2:inlet
    components:
      - kind: valve
        id: valve4
        name: Pump to House 2
        open_pin: GPIO39
        close_pin: GPIO40
      - kind: flow_sensor
        id: flow2
        name: House 2 Water Flow
        pin: GPIO46
        flow_cal: 450
route_overrides:
  tank1>tank2:
    name: T1>T2
    max_runtime_seconds: 600
  tank1>h2:
    name: T1>H2
    max_runtime_seconds: 1800
  tank2>h2:
    name: T2>H2
    max_runtime_seconds: 1800
timing:
  valve_travel_time: 15s
  flow_watchdog_seconds: 30
  flow_confirm_seconds: 15
  api_watchdog_seconds: 300
  update_interval: 5s
