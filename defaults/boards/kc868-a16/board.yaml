schema: 5

# =============================================================================
# Kincony KC868-A16 — Board Definition
# =============================================================================
# ESP32-based smart controller with 16 relay outputs and 16 digital inputs
# via PCF8574 I2C GPIO expanders, plus native ADC and sensor headers.
#
# Networking: Ethernet (LAN8720) — no WiFi required for HA communication.
# RS485: TX=GPIO13, RX=GPIO16 (auto-direction via MAX13487E, no DE pin).
#
# Pin naming:
#   OUT1-OUT16  — PCF8574 relay outputs (active-low, inverted in ESPHome)
#   IN1-IN16    — PCF8574 optocoupled digital inputs
#   GPIO36/34/35/39 — native ADC inputs (0-5V, op-amp conditioned)
#   GPIO32/33/14    — sensor headers (3.3V pull-up, DS18B20/pulse counter)
#
# Sources:
#   https://github.com/hzkincony/kc868-a16
#   https://devices.esphome.io/devices/kincony-kc868-a16/
#   https://www.kincony.com/esp32-board-16-channel-relay-hardware.html
# =============================================================================

model: kc868_a16
label: Kincony KC868-A16
svg: board.svg

mcu:
  variant: esp32
  flash_size: 4MB
  framework: esp-idf

peripherals:
  ethernet:
    type: LAN8720
    mdc_pin: GPIO23
    mdio_pin: GPIO18
    clk:
      pin: GPIO17
      mode: CLK_OUT
    phy_addr: 0

buses:
  i2c:
    sda: GPIO4
    scl: GPIO5
    frequency: 100kHz
  uart:
    tx: GPIO13
    rx: GPIO16

expanders:
  - id: pcf8574_out_1
    platform: pcf8574
    address: 0x24
    pcf8575: false
  - id: pcf8574_out_2
    platform: pcf8574
    address: 0x25
    pcf8575: false
  - id: pcf8574_in_1
    platform: pcf8574
    address: 0x22
    pcf8575: false
  - id: pcf8574_in_2
    platform: pcf8574
    address: 0x21
    pcf8575: false

pins:
  # --- Relay outputs (K1-K16) via PCF8574 expanders --------------------------
  - { gpio: OUT1,  expander: pcf8574_out_1, number: 0, connector: relay_k1,  edge: right, caps: [digital] }
  - { gpio: OUT2,  expander: pcf8574_out_1, number: 1, connector: relay_k2,  edge: right, caps: [digital] }
  - { gpio: OUT3,  expander: pcf8574_out_1, number: 2, connector: relay_k3,  edge: right, caps: [digital] }
  - { gpio: OUT4,  expander: pcf8574_out_1, number: 3, connector: relay_k4,  edge: right, caps: [digital] }
  - { gpio: OUT5,  expander: pcf8574_out_1, number: 4, connector: relay_k5,  edge: right, caps: [digital] }
  - { gpio: OUT6,  expander: pcf8574_out_1, number: 5, connector: relay_k6,  edge: right, caps: [digital] }
  - { gpio: OUT7,  expander: pcf8574_out_1, number: 6, connector: relay_k7,  edge: right, caps: [digital] }
  - { gpio: OUT8,  expander: pcf8574_out_1, number: 7, connector: relay_k8,  edge: right, caps: [digital] }
  - { gpio: OUT9,  expander: pcf8574_out_2, number: 0, connector: relay_k9,  edge: right, caps: [digital] }
  - { gpio: OUT10, expander: pcf8574_out_2, number: 1, connector: relay_k10, edge: right, caps: [digital] }
  - { gpio: OUT11, expander: pcf8574_out_2, number: 2, connector: relay_k11, edge: right, caps: [digital] }
  - { gpio: OUT12, expander: pcf8574_out_2, number: 3, connector: relay_k12, edge: right, caps: [digital] }
  - { gpio: OUT13, expander: pcf8574_out_2, number: 4, connector: relay_k13, edge: right, caps: [digital] }
  - { gpio: OUT14, expander: pcf8574_out_2, number: 5, connector: relay_k14, edge: right, caps: [digital] }
  - { gpio: OUT15, expander: pcf8574_out_2, number: 6, connector: relay_k15, edge: right, caps: [digital] }
  - { gpio: OUT16, expander: pcf8574_out_2, number: 7, connector: relay_k16, edge: right, caps: [digital] }

  # --- Digital inputs (X1-X16) via PCF8574 expanders -------------------------
  - { gpio: IN1,  expander: pcf8574_in_1, number: 0, connector: input_x1,  edge: left, caps: [digital] }
  - { gpio: IN2,  expander: pcf8574_in_1, number: 1, connector: input_x2,  edge: left, caps: [digital] }
  - { gpio: IN3,  expander: pcf8574_in_1, number: 2, connector: input_x3,  edge: left, caps: [digital] }
  - { gpio: IN4,  expander: pcf8574_in_1, number: 3, connector: input_x4,  edge: left, caps: [digital] }
  - { gpio: IN5,  expander: pcf8574_in_1, number: 4, connector: input_x5,  edge: left, caps: [digital] }
  - { gpio: IN6,  expander: pcf8574_in_1, number: 5, connector: input_x6,  edge: left, caps: [digital] }
  - { gpio: IN7,  expander: pcf8574_in_1, number: 6, connector: input_x7,  edge: left, caps: [digital] }
  - { gpio: IN8,  expander: pcf8574_in_1, number: 7, connector: input_x8,  edge: left, caps: [digital] }
  - { gpio: IN9,  expander: pcf8574_in_2, number: 0, connector: input_x9,  edge: left, caps: [digital] }
  - { gpio: IN10, expander: pcf8574_in_2, number: 1, connector: input_x10, edge: left, caps: [digital] }
  - { gpio: IN11, expander: pcf8574_in_2, number: 2, connector: input_x11, edge: left, caps: [digital] }
  - { gpio: IN12, expander: pcf8574_in_2, number: 3, connector: input_x12, edge: left, caps: [digital] }
  - { gpio: IN13, expander: pcf8574_in_2, number: 4, connector: input_x13, edge: left, caps: [digital] }
  - { gpio: IN14, expander: pcf8574_in_2, number: 5, connector: input_x14, edge: left, caps: [digital] }
  - { gpio: IN15, expander: pcf8574_in_2, number: 6, connector: input_x15, edge: left, caps: [digital] }
  - { gpio: IN16, expander: pcf8574_in_2, number: 7, connector: input_x16, edge: left, caps: [digital] }

  # --- Native ADC inputs (0-5V, op-amp conditioned via LM324) ----------------
  - { gpio: GPIO36, connector: adc_a1, edge: bottom, caps: [digital, adc] }
  - { gpio: GPIO34, connector: adc_a2, edge: bottom, caps: [digital, adc] }
  - { gpio: GPIO35, connector: adc_a3, edge: bottom, caps: [digital, adc] }
  - { gpio: GPIO39, connector: adc_a4, edge: bottom, caps: [digital, adc] }

  # --- Sensor headers (3.3V pull-up, DS18B20/pulse counter capable) ----------
  - { gpio: GPIO32, connector: ht1, edge: bottom, caps: [digital, pulse_counter] }
  - { gpio: GPIO33, connector: ht2, edge: bottom, caps: [digital, pulse_counter] }
  - { gpio: GPIO14, connector: ht3, edge: bottom, caps: [digital, pulse_counter] }
