schema: 5

# =============================================================================
# SONOFF BASICR4 — Board Definition
# =============================================================================
# Compact ESP32-C3 based smart switch with a single relay.
# Ideal for single-phase pump control via the onboard 10A relay.
#
# Pinout:
#   GPIO4  — Relay output (active high, 10A @ 100-240V AC)
#   GPIO5  — Magic Switch input (external toggle/flow sensor)
#   GPIO6  — Status LED (blue)
#   GPIO9  — Onboard button (not exposed — used for provisioning/reset)
#   GPIO20 — U0RXD (programming, not exposed)
#   GPIO21 — U0TXD (programming, not exposed)
#
# Sources:
#   https://digiblur.com/wiki/devices/relays/sonoff-basic-r4/
#   https://devices.esphome.io/devices/Sonoff-Basic-R4/
# =============================================================================

model: sonoff-basicr4
label: SONOFF BASICR4
svg: board.svg

mcu:
  variant: esp32c3
  flash_size: 4MB
  framework: esp-idf

peripherals:
  led:
    pin: GPIO6

buses: {}

pins:
  # Relay output — primary pump control pin
  - { gpio: GPIO4, connector: relay_out, edge: right, caps: [digital] }

  # Magic Switch input — can be used for external flow sensor or float switch
  - { gpio: GPIO5, connector: switch_in, edge: left, caps: [digital, pulse_counter] }
