schema: 2

# =============================================================================
# Water System Manifest — Pump Controller
# =============================================================================
# Describes the physical topology of the water system. The codegen tool
# reads this file and generates all ESPHome YAML + C++ files.
#
# Every route requires a flow sensor. Tank level sensors are suppressed
# during pump operation. Dest tanks need hardware float switches.
# =============================================================================

device:
  name: pump-ctrl
  friendly_name: Pump-ctrl
  board: heltec-v3
  directory: pump-controller

pump:
  pin: GPIO42

tanks:
  - name: Rain Tank
    id: tank1
    level_pin: GPIO19

  - name: Storage Tank
    id: tank2
    level_pin: GPIO20

valves:
  - name: Tank 1 Outlet
    id: valve1
    open_pin: GPIO4
    close_pin: GPIO5

  - name: Tank 2 Outlet
    id: valve2
    open_pin: GPIO6
    close_pin: GPIO7

  - name: Pump to Tank 2
    id: valve3
    open_pin: GPIO2
    close_pin: GPIO3

  - name: Pump to House 2
    id: valve4
    open_pin: GPIO39
    close_pin: GPIO40

flow_sensors:
  - name: House 1 Water Flow
    id: flow1
    pin: GPIO45
    flow_cal: 450.0

  - name: House 2 Water Flow
    id: flow2
    pin: GPIO46
    flow_cal: 450.0

  - name: Refill Line Flow
    id: flow3
    pin: GPIO47
    flow_cal: 450.0

routes:
  - name: "T1>T2"
    source: tank1
    destination: tank2
    valves: [valve1, valve3]
    flow_sensor: flow3
    max_runtime_seconds: 600

  - name: "T1>H2"
    source: tank1
    valves: [valve1, valve4]
    flow_sensor: flow2
    max_runtime_seconds: 1800

  - name: "T2>H2"
    source: tank2
    valves: [valve2, valve4]
    flow_sensor: flow2
    max_runtime_seconds: 1800

timing:
  valve_travel_time: "15s"
  flow_watchdog_seconds: 30
  flow_confirm_seconds: 15
  api_watchdog_seconds: 300
  update_interval: "5s"
