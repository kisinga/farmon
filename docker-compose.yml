# MajiFlow server — one container: PocketBase (SQLite + SPA + REST API + /_/ admin)
# with an embedded MQTT broker. No external DB/broker/HA services: the old
# HA + ChirpStack + ESPHome stack is gone.
#
# Coolify: proxy 8090 to your domain (HTTPS handled by Coolify); expose 8883 (TLS
# MQTT) as raw TCP for devices. Plain 1883 is opt-in for local on-prem only — see
# docker-compose.override.example.yml. Config is supplied per-variable via the
# `environment:` block below: set the values in Coolify's env-var UI, or (local)
# copy .env.example to .env and let Compose auto-load it. See .env.example for the
# profiles and what each variable means.

services:
  maji-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Each value is interpolated from the deploy environment: Coolify's env-var UI
    # (it scans these ${...} refs and surfaces them as editable fields), or a local
    # ./.env that Compose auto-loads. Unset → blank, which the app/entrypoint treat
    # as "use the built-in default" (see internal/config and deploy/entrypoint.sh).
    environment:
      # App admin — the SPA login (role=admin), seeded once on first boot.
      MAJI_ADMIN_EMAIL: ${MAJI_ADMIN_EMAIL}
      MAJI_ADMIN_PASSWORD: ${MAJI_ADMIN_PASSWORD}
      # PocketBase superuser — the /_/ dashboard login (distinct from the app admin).
      MAJI_SUPERUSER_EMAIL: ${MAJI_SUPERUSER_EMAIL}
      MAJI_SUPERUSER_PASSWORD: ${MAJI_SUPERUSER_PASSWORD}
      # Device-facing endpoint baked into generated firmware (what hosts dial out to).
      MAJI_MQTT_PUBLIC_HOST: ${MAJI_MQTT_PUBLIC_HOST:-mqtt.majiflow.io}
      MAJI_MQTT_PUBLIC_PORT: ${MAJI_MQTT_PUBLIC_PORT:-8883}
      MAJI_MQTT_PUBLIC_TLS: ${MAJI_MQTT_PUBLIC_TLS:-true}
      # Device-facing TLS listener — managed/cloud only; off → plain 1883, no certs.
      # The cert/key paths resolve inside the always-on /certs mount (see volumes);
      # they are only read when MAJI_MQTT_TLS_ENABLED=true.
      MAJI_MQTT_TLS_ENABLED: ${MAJI_MQTT_TLS_ENABLED:-false}
      MAJI_MQTT_TLS: ${MAJI_MQTT_TLS:-:8883}
      MAJI_MQTT_TLS_CERT: ${MAJI_MQTT_TLS_CERT:-/certs/fullchain.pem}
      MAJI_MQTT_TLS_KEY: ${MAJI_MQTT_TLS_KEY:-/certs/privkey.pem}
      # OpenWA WhatsApp gateway (optional; primary external alert channel).
      MAJI_OPENWA_BASE_URL: ${MAJI_OPENWA_BASE_URL:-}
      MAJI_OPENWA_API_KEY: ${MAJI_OPENWA_API_KEY:-}
      MAJI_OPENWA_SESSION: ${MAJI_OPENWA_SESSION:-}
      # Broker bind addresses inside the container (rarely changed; app defaults apply).
      MAJI_MQTT_TCP: ${MAJI_MQTT_TCP:-:1883}
      MAJI_MQTT_WS: ${MAJI_MQTT_WS:-:8082}
      # Shengda meter listener (cloud billing; empty MAJI_METER_UDP_ADDR = disabled).
      MAJI_METER_UDP_ADDR: ${MAJI_METER_UDP_ADDR:-}
      MAJI_METER_CMD_WINDOW_MS: ${MAJI_METER_CMD_WINDOW_MS:-8000}
      MAJI_METER_CMD_TTL_H: ${MAJI_METER_CMD_TTL_H:-48}
      MAJI_METER_TZ: ${MAJI_METER_TZ:-UTC+3}
      # Dev/testing ONLY — never set in prod: email allowlist that enables the
      # persona switcher (see AGENTS.md "Dev persona switcher"). Empty = off.
      MAJI_PERSONA_EMAILS: ${MAJI_PERSONA_EMAILS:-}
    ports:
      - "8090:8090"   # HTTP: SPA + /api + /_/  (Coolify routes this to your domain)
      - "8883:8883"   # TLS MQTT (device-facing; serves when MAJI_MQTT_TLS_ENABLED=true)
      - "5683:5683/udp"  # Shengda meter uplinks (billing; the listener binds only when MAJI_METER_UDP_ADDR is set — Coolify: expose as raw UDP)
      # Plain 1883 is intentionally NOT published — managed/cloud stays TLS-only, no
      # plaintext on the internet. For a local/LAN on-prem box that wants plain 1883,
      # copy docker-compose.override.example.yml → docker-compose.override.yml (Compose
      # auto-loads it locally; Coolify uses an explicit -f so it's ignored there, and
      # it's git-ignored regardless). The broker still binds 1883 inside the container;
      # this only governs host exposure.
    volumes:
      # The single stateful boundary: SQLite DB + uploaded files + logs + backups.
      - pb_data:/pb_data
      # Device-facing 8883 TLS. Declared as individual FILE bind mounts so Coolify
      # exposes them under Storages → Files (a compose service's storage is derived
      # from these volume lines): paste the cert + key contents there and Coolify
      # writes them to the source path and mounts them. ONLY these two ever reach the
      # server — never ca-key.pem (keep it OFFLINE); ca.pem is derived from
      # fullchain.pem server-side, not mounted. Source files are git-ignored
      # (deploy/certs/.gitignore); for a LOCAL TLS run create them first with
      # deploy/gen-selfsigned-certs.sh, else Docker makes empty dirs in their place.
      # On-prem default = plain 1883 (TLS off), where /certs is never read.
      - ./deploy/certs/fullchain.pem:/certs/fullchain.pem:ro
      - ./deploy/certs/privkey.pem:/certs/privkey.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/farmon/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Named volume → the orchestrator owns where the bytes live; the storage backend
  # is swappable without touching the image or this file.
  pb_data:
